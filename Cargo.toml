[package]
name = "claunch"
version = "0.3.0"
edition = "2024"
description = "Launcher TUI para repos y sesiones de Claude Code en Windows (Windows Terminal + Git Bash) y Linux (tmux o emulador gráfico)"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
jiff = "0.2.39"
memchr = "2.8.3"
ratatui = "0.30"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "preserve_order"] }
tachyonfx = "0.25"
toml = "1.2.0"
unicode-width = "0.2.3"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
