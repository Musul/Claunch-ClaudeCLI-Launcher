name: release

# Publica claunch-windows-x64.zip y claunch-linux-x64.tar.gz (+ .sha256) al
# empujar una etiqueta vX.Y.Z. install.ps1 e install.sh descargan siempre la
# última release publicada. Si un binario falla, no se publica nada.
# Lanzado a mano (workflow_dispatch) es un ensayo: compila, empaqueta y
# verifica los SHA-256, pero no publica.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Solo acciones de GitHub (actions/*): la organización puede bloquear las de terceros.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust estable (rustup ya viene en el runner)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: La etiqueta coincide con Cargo.toml
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "La etiqueta $env:GITHUB_REF_NAME no coincide con Cargo.toml (v$v)" }
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path target/release/claunch.exe -DestinationPath dist/claunch-windows-x64.zip
          $h = (Get-FileHash dist/claunch-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  claunch-windows-x64.zip" | Out-File -Encoding ascii dist/claunch-windows-x64.zip.sha256
          Get-Content dist/claunch-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # Binario estático (musl): funciona en cualquier distribución x86_64.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust estable con destino musl
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
          sudo apt-get update && sudo apt-get install -y musl-tools
      - name: La etiqueta coincide con Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "La etiqueta $GITHUB_REF_NAME no coincide con Cargo.toml (v$v)"; exit 1; }
      - run: cargo test --locked
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Empaquetar
        run: |
          mkdir dist
          tar -czf dist/claunch-linux-x64.tar.gz -C target/x86_64-unknown-linux-musl/release claunch
          (cd dist && sha256sum claunch-linux-x64.tar.gz > claunch-linux-x64.tar.gz.sha256)
          cat dist/claunch-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verificar paquetes (SHA-256)
        run: |
          ls -l dist
          cd dist
          for f in *.sha256; do sed 's/\r$//' "$f" | sha256sum -c -; done
      - name: Publicar release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "claunch $GITHUB_REF_NAME" --generate-notes
