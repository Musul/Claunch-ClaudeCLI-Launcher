name: ci

on:
  push:
    branches: [main]
  pull_request:

# Solo acciones de GitHub (actions/*): la organización puede bloquear las de terceros.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Rust estable (rustup ya viene en el runner)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo test --locked
      - name: Instalador de Windows (sintaxis PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errs)
          if ($errs.Count) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Instalador de Linux (sh -n y shellcheck)
        if: runner.os == 'Linux'
        run: |
          sh -n install.sh
          shellcheck -s sh install.sh
          test -x install.sh || { echo "install.sh debe ser ejecutable (git update-index --chmod=+x)"; exit 1; }
